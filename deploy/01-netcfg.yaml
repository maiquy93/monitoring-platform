# Cấu hình IP tĩnh cho card mạng ens33
# File đích trên hệ thống: /etc/netplan/01-netcfg.yaml
network:
  version: 2
  renderer: networkd
  ethernets:
    ens33:
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.60.53/24
      routes:
        - to: default
          via: 192.168.60.1
      nameservers:
        addresses:
          - 10.1.0.4
          - 10.1.0.2
          - 8.8.8.8
        search:
          - DHCP2
